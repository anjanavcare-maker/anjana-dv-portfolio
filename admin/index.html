<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visual Editor — Anjana DV</title>
  <link rel="stylesheet" href="editor.css" />
</head>
<body>
  <header id="topbar">
    <div class="brand">
      <img src="../assets/logo-anjana-transparent.png" alt="" width="30" height="30" />
      <div>
        <strong>Anjana DV</strong>
        <span class="sub">Visual Editor</span>
      </div>
    </div>
    <div class="nav">
      <button class="pv-btn active" data-page="index.html">Home</button>
      <button class="pv-btn" data-page="about.html">About</button>
      <button class="pv-btn" data-page="pricing.html">Pricing</button>
    </div>
    <div class="actions">
      <span id="dirty" class="dirty" hidden>● unsaved</span>
      <button id="btn-token" class="btn ghost">Token</button>
      <button id="btn-reset" class="btn ghost" title="Reload from GitHub">Reset</button>
      <button id="btn-publish" class="btn primary">Save &amp; Publish</button>
    </div>
  </header>

  <div id="statusbar">
    <span id="status">Loading content…</span>
  </div>

  <main id="split">
    <aside id="panel">
      <div id="fields"></div>
    </aside>
    <section id="preview">
      <iframe id="cms-frame" title="Live preview"></iframe>
    </section>
  </main>

  <div id="token-overlay" hidden>
    <div class="token-card">
      <h2>GitHub access token</h2>
      <p>Paste the GitHub personal access token (classic, with <code>repo</code> scope). It is stored only in this browser. You can copy it from <code>C:\Users\SHINIL\github-token.txt</code> (starts with <code>ghp_</code>).</p>
      <input id="token-input" type="password" placeholder="ghp_…" autocomplete="off" />
      <div class="row">
        <button id="btn-token-save" class="btn primary">Save token</button>
        <button id="btn-token-cancel" class="btn ghost">Cancel</button>
      </div>
      <p id="token-msg" class="msg"></p>
    </div>
  </div>

  <script src="editor.js"></script>
</body>
</html>
